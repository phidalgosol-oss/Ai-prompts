<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@prihisol — Instagram cover template v1</title>
<style>
  /* ============================================================
     BRAND TOKENS — anchor green #1B4D3E is confirmed brand canon.
     The other values are placeholders to SYNC with the website's
     src/styles/tokens.css (fonts especially — see brief §9).
     Never add off-palette colors; propose a token instead.
     ============================================================ */
  :root {
    --brand:      #1B4D3E;  /* CONFIRMED: deep forest green anchor */
    --paper:      #F5F1E8;  /* sync w/ tokens.css: warm calm neutral, never #fff */
    --ink:        #23271F;  /* sync w/ tokens.css: warm near-black, never #000 */
    --muted:      #6E7268;  /* sync w/ tokens.css */

    --font-head:  Georgia, "Times New Roman", serif;          /* [FILL] sync w/ tokens.css */
    --font-body:  "Avenir Next", "Segoe UI", Arial, sans-serif; /* [FILL] sync w/ tokens.css */

    --pad: 96px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Canvas: 1080×1350 = Instagram 4:5 portrait */
  body {
    width: 1080px;
    height: 1350px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
  }

  .frame {
    width: 100%; height: 100%;
    padding: var(--pad);
    display: flex;
    flex-direction: column;
    box-shadow: inset 0 0 0 2px var(--brand);
  }

  .kicker {
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .kicker::after {
    content: "";
    flex: 1;
    height: 2px;
    background: var(--brand);
    opacity: 0.35;
  }

  /* Optional photo block — hidden unless ?img= is provided */
  .art {
    display: none;
    height: 460px;
    margin-top: 56px;
    overflow: hidden;
  }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  body.has-art .art { display: block; }

  .title-wrap {
    flex: 1;
    display: flex;
    align-items: center;
  }
  .title {
    font-family: var(--font-head);
    font-size: 92px;
    line-height: 1.16;
    font-weight: 400;
    color: var(--brand);
    max-width: 15ch;
  }
  body.has-art .title { font-size: 68px; }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 30px;
  }
  .footer .name   { font-weight: 600; color: var(--ink); }
  .footer .handle { color: var(--muted); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="frame">
    <div class="kicker" data-field="kicker">The idea</div>

    <div class="art" id="art"></div>

    <div class="title-wrap">
      <h1 class="title" data-field="title">AI on a broken process is just a faster broken process.</h1>
    </div>

    <div class="footer">
      <span class="name" data-field="name">Priscilla Hidalgo</span>
      <span class="handle" data-field="handle">@prihisol</span>
    </div>
  </div>

<script>
  // Fill fields from URL params so the template works in a plain
  // browser AND from the render script:
  //   file://.../cover-template.html?kicker=The%20idea&title=...&img=photos/foo.jpg
  const q = new URLSearchParams(location.search);
  for (const el of document.querySelectorAll("[data-field]")) {
    const v = q.get(el.dataset.field);
    if (v) el.textContent = v;
  }
  const img = q.get("img");
  if (img) {
    document.body.classList.add("has-art");
    const tag = document.createElement("img");
    tag.src = img;
    document.getElementById("art").appendChild(tag);
  }
</script>
</body>
</html>
