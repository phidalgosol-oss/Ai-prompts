<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>@prihisol — Instagram cover template v1</title>
<style>
  /* ============================================================
     PALETTE — whimsical-warm direction for the PERSONAL account.
     Green #1B4D3E carries over from her confirmed palette; the
     rest are provisional until she signs off the look (brief §9).
     Fonts are placeholders — [FILL] with her chosen faces.
     ============================================================ */
  :root {
    --paper:  #F7F2E7;  /* warm cream, provisional */
    --ink:    #2A2A24;  /* warm near-black, provisional */
    --verde:  #1B4D3E;  /* her confirmed deep forest green */
    --sol:    #C9973B;  /* warm gold for sparkle accents, provisional */

    --font-title: Georgia, "Times New Roman", serif;            /* [FILL] */
    --font-small: "Avenir Next", "Segoe UI", Arial, sans-serif; /* [FILL] */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Canvas: 1080×1350 = Instagram 4:5 portrait */
  body {
    width: 1080px;
    height: 1350px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-small);
    overflow: hidden;
  }

  .frame {
    width: 100%; height: 100%;
    padding: 64px 64px 72px;
    display: flex;
    flex-direction: column;
  }

  .kicker {
    display: flex;
    align-items: baseline;
    gap: 20px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--verde);
  }
  .kicker .spark { color: var(--sol); letter-spacing: 0; font-size: 30px; }

  /* The photo is the hero — nostalgic print feel: cream mat, soft shadow */
  .art {
    margin-top: 44px;
    height: 780px;
    background: var(--verde);
    box-shadow: 0 18px 50px rgba(42, 42, 36, 0.18);
    overflow: hidden;
  }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art .placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--paper);
    font-size: 38px;
    font-style: italic;
    font-family: var(--font-title);
  }

  /* Without a photo the title carries the card (rare on this account) */
  body.no-art .art { display: none; }
  body.no-art .title { font-size: 88px; }

  .title-wrap {
    flex: 1;
    display: flex;
    align-items: center;
  }
  .title {
    font-family: var(--font-title);
    font-style: italic;
    font-size: 64px;
    line-height: 1.22;
    font-weight: 400;
    color: var(--verde);
    max-width: 20ch;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 28px;
  }
  .footer .spark  { color: var(--sol); }
  .footer .handle { color: var(--ink); opacity: 0.55; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="frame">
    <div class="kicker">
      <span class="spark">✨</span>
      <span data-field="kicker">Movimiento &amp; nostalgia</span>
    </div>

    <div class="art" id="art">
      <div class="placeholder">tu foto va aquí</div>
    </div>

    <div class="title-wrap">
      <h1 class="title" data-field="title">La verdadera magia está en cada paso.</h1>
    </div>

    <div class="footer">
      <span class="spark">✨✨✨</span>
      <span class="handle" data-field="handle">@prihisol</span>
    </div>
  </div>

<script>
  // Fill fields from URL params so the template works in a plain
  // browser AND from the render script:
  //   file://.../cover-template.html?kicker=Cultura&title=...&img=photos/camino.jpg
  const q = new URLSearchParams(location.search);
  for (const el of document.querySelectorAll("[data-field]")) {
    const v = q.get(el.dataset.field);
    if (v) el.textContent = v;
  }
  const img = q.get("img");
  if (img) {
    const art = document.getElementById("art");
    art.innerHTML = "";
    const tag = document.createElement("img");
    tag.src = img;
    art.appendChild(tag);
  } else if (q.get("noart") === "1") {
    document.body.classList.add("no-art");
  }
</script>
</body>
</html>
